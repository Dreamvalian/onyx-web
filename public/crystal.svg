  />
  <polyline
    points="340,240 400,200 460,240"
    fill="none"
    stroke="#94A99B"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <polyline
    points="400,120 400,200 400,280"
    fill="none"
    stroke="#94A99B"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Accent facet (top) -->
  <polygon
    points="380,130 420,145 420,165 400,180 380,165 380,145"
    fill="#A3B5AA"
