<svg xmlns="http://www.w3.org/2000/svg" viewBox="320 100 160 200" width="256" height="256">
  <!-- Main crystal body -->
  <polygon
    points="400,120 460,160 460,240 400,280 340,240 340,160"
    fill="#1A1714"
    stroke="#94A99B"
    stroke-width="2"
    stroke-linejoin="round"
  />
  <!-- Facet lines -->
  <polyline
    points="340,160 400,200 460,160"
