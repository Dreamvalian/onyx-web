<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!-- Crystal mark -->
  <g transform="translate(10, 10) scale(0.5)">
    <polygon
      points="400,120 460,160 460,240 400,280 340,240 340,160"
      fill="#E8E0D4"
      stroke="#0D0B08"
      stroke-width="3"
      stroke-linejoin="round"
    />
    <polyline points="340,160 400,200 460,160" fill="none" stroke="#0D0B08" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="340,240 400,200 460,240" fill="none" stroke="#0D0B08" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="400,120 400,200 400,280" fill="none" stroke="#0D0B08" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <polygon
      points="380,130 420,145 420,165 400,180 380,165 380,145"
      fill="#94A99B"
      fill-opacity="0.4"
      stroke="#94A99B"
      stroke-width="1.5"
      stroke-linejoin="round"
    />
  </g>
  <!-- Wordmark -->
  <text
    x="90"
    y="52"
    font-family="'DM Serif Display', Georgia, serif"
    font-size="42"
    fill="#0D0B08"
    letter-spacing="-0.5"
  >Onyx</text>
</svg>
